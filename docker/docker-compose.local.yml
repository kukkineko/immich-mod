# Local dev override: run with
#   docker compose -f docker-compose.dev.yml -f docker-compose.local.yml up
# Mounts the (git-ignored) ./xx folder at the repo root as the library the folder-people UI reads.
services:
  immich-server:
    volumes:
      - ../xx:/media
      # photos for the travel mode: paste trips as ./travel/<Trip name>/*.jpg, then add /media-travel as an
      # external library in the admin settings. Travel mode reads this root.
      - ../travel:/media-travel
    environment:
      IMMICH_TRAVEL_ROOT: /media-travel
